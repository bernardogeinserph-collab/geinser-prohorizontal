<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d2d4a" />
    <title>Geinser Prohorizontal</title>
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Anti-cache roto: si el bundle no carga, forzar recarga limpia una sola vez
      window.addEventListener('error', function(e){
        var t = e.target || {};
        if((t.tagName==='SCRIPT'||t.tagName==='LINK') && !sessionStorage.getItem('gz_reloaded')){
          sessionStorage.setItem('gz_reloaded','1');
          if(window.caches){caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k)})})}
          if(navigator.serviceWorker){navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister()})})}
          setTimeout(function(){location.reload()},400);
        }
      }, true);
      // Marcar carga exitosa
      window.addEventListener('load', function(){ setTimeout(function(){ if(document.getElementById('root').children.length>0) sessionStorage.removeItem('gz_reloaded') }, 2000) });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
